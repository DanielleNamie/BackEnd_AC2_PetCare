spring.application.name=petcare

#  PARTE 1 — SISTEMA DE PROJETOS
#  Porta diferente da Parte 2 para rodar as duas ao mesmo tempo

server.port=8081

# --- Banco H2 em memória ---
spring.datasource.url=jdbc:h2:mem:projetosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# create-drop: cria as tabelas ao iniciar e derruba ao parar (ótimo para H2)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- Console do H2 (acesse: http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
